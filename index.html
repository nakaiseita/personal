<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15324f">
  <meta name="description" content="必要なページにワンタップでアクセスできるリンク集です。">
  <title>リンク一覧</title>
  <style>
    :root {
      --navy: #15324f;
      --blue: #2563eb;
      --light-blue: #eff6ff;
      --background: #f5f8fc;
      --text: #172a40;
      --muted: #56677a;
      --border: #dce5ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% -15%, #dfebff 0, transparent 60%), var(--background);
    }
    .wrap { max-width: 690px; margin: 0 auto; padding: 68px 20px 48px; }
    .eyebrow { margin: 0 0 12px; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; color: var(--navy); font-size: clamp(30px, 7vw, 44px); line-height: 1.3; letter-spacing: .03em; }
    .lead { margin: 13px 0 34px; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .links { display: grid; gap: 14px; }
    .link {
      display: flex; align-items: center; gap: 17px;
      width: 100%; min-height: 90px; padding: 18px 19px;
      color: inherit; text-decoration: none;
      background: #fff; border: 1px solid var(--border); border-radius: 17px;
      box-shadow: 0 6px 24px rgba(20, 46, 77, .045);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: #a9c4f9; box-shadow: 0 12px 28px rgba(20, 46, 77, .11); }
    .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .number {
      display: grid; flex: 0 0 43px; width: 43px; height: 43px; place-items: center;
      border-radius: 12px; background: var(--light-blue); color: var(--blue);
      font-weight: 800; font-size: 15px;
    }
    .content { min-width: 0; flex: 1; }
    .name { display: block; margin-bottom: 4px; color: var(--navy); font-weight: 800; font-size: 17px; }
    .description { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .arrow { margin-left: auto; color: var(--blue); font-size: 25px; line-height: 1; aria-hidden: true; }
    footer { margin-top: 34px; color: #718096; text-align: center; font-size: 12px; }
    @media (max-width: 480px) {
      .wrap { padding: 52px 16px 36px; }
      .lead { margin-bottom: 28px; }
      .link { min-height: 88px; padding: 15px; gap: 13px; }
      .number { flex-basis: 39px; width: 39px; height: 39px; }
      .name { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- ここの見出しと説明文を書き換えてください -->
    <p class="eyebrow">QUICK LINKS</p>
    <h1>リンク一覧</h1>
    <p class="lead">見たい項目を選ぶと、目的のページに移動できます。</p>

    <nav class="links" aria-label="リンク一覧">
      <!-- 編集方法：href="..." を実際のURLに変更し、項目名と説明も書き換えます。 -->
      <!-- ↓↓↓ サンプルURLの https://example.com は公開前に必ず変更してください ↓↓↓ -->
      <a class="link" href="https://example.com">
        <span class="number" aria-hidden="true">01</span>
        <span class="content"><span class="name">公式サイト</span><span class="description">詳しい情報はこちら</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link" href="https://example.com">
        <span class="number" aria-hidden="true">02</span>
        <span class="content"><span class="name">イベント・お知らせ</span><span class="description">最新情報を確認できます</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link" href="https://example.com">
        <span class="number" aria-hidden="true">03</span>
        <span class="content"><span class="name">Instagram</span><span class="description">写真や最新の投稿はこちら</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link" href="https://example.com">
        <span class="number" aria-hidden="true">04</span>
        <span class="content"><span class="name">お問い合わせ</span><span class="description">ご質問・ご連絡はこちら</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>
    <footer>タップするだけで各ページに移動できます。</footer>
  </main>
</body>
</html>
